# Workflow que gera uma animação do jogo Tron usando seu gráfico de contribuições.
# Arquivo: .github/workflows/main.yml

name: Tron Arcade Contribution Graph

on:
  # Atualiza a animação diariamente (03:00 UTC).
  schedule:
    - cron: "0 3 * * *"

  # Permite iniciar a geração manualmente pela aba Actions.
  workflow_dispatch:

  # Também atualiza quando alterações são enviadas para a branch principal.
  push:
    branches:
      - main

# Permite que a action publique os SVGs na branch output.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Gera duas versões do jogo Tron usando os dados de contribuição de Felpsale.
      - name: Generate Tron arcade SVGs
        uses: Nicsilver/commit-arcade@v1
        with:
          github_user_name: Felpsale
          outputs: |
            dist/tron.svg?game=tron&theme=neon
            dist/tron-light.svg?game=tron&theme=github-light

      # Publica as imagens geradas na branch output.
      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
