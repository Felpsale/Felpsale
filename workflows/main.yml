# Gera uma animação do Pac-Man usando os dados reais do calendário de contribuições.
# Este arquivo deve ficar em: .github/workflows/main.yml

name: generate arcade contribution graphs

on:
  # Atualiza automaticamente uma vez por dia (horário UTC).
  schedule:
    - cron: '0 0 * * *'

  # Permite executar manualmente pela aba Actions.
  workflow_dispatch:

  # Também atualiza quando você envia alterações para a branch main.
  # Se a branch principal do seu repositório se chamar master, troque main por master.
  push:
    branches:
      - main

jobs:
  generate:
    # Permite que a Action publique os SVGs na branch output.
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          # O dono do repositório de perfil é usado como nome de usuário do GitHub.
          github_user_name: ${{ github.repository_owner }}

          # Pode adicionar outros jogos separados por vírgula, por exemplo: 'pacman,snake'.
          games: 'pacman'

          # Mantém os nomes dos meses acima do gráfico.
          hide_month_labels: 'false'

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
